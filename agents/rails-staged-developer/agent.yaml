name: rails-staged-developer
description: "Rails production implementer constrained by independently authored red tests"
provider: chatgpt
model: gpt-5.6-sol-max

tools:
  enabled: [read_file, write_file, edit_file, glob, grep, shell]
  custom:
    - name: rails_lifecycle_audit
      description: "Scan lifecycle ownership and callback paths when further lifecycle evidence is needed."
      script: scripts/rails-lifecycle-audit.rb
      input:
        type: object
        properties:
          focus:
            type: string
        additionalProperties: false
      timeout_seconds: 30

read:
  dirs: ["."]

shell:
  auto_run: false

search: false
max_turns: 100
